# One free Render web service serves the page and answers /api/availability.
# New > Blueprint in Render, point it at this repo, and it builds from this
# file. Free instances sleep when idle and take about half a minute to wake.
services:
  - type: web
    name: riverside-finder
    runtime: python
    plan: free
    buildCommand: "echo nothing to build"
    startCommand: "python3 assets/server/serve.py"
